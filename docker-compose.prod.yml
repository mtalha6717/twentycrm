name: twenty

# Builds the Twenty app image from THIS local source tree using the repo's
# official multi-stage Dockerfile (target "twenty" = server + bundled frontend).
# server and worker share the single locally-built image "twenty:local".
# Postgres and Redis stay as stock images.

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
  SERVER_URL: ${SERVER_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
  APP_SECRET: ${APP_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}

services:
  server:
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
      args:
        APP_VERSION: ${APP_VERSION:-2.41.0}
    image: twenty:local
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    image: twenty:local
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true" # server owns migrations
      DISABLE_CRON_JOBS_REGISTRATION: "true" # server owns cron registration
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
